name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Allow a manual dry run from the Actions tab (builds, but only publishes on a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the target toolchain and, for cross targets, the `cross`
      # runner. A no-op for native targets.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Builds `wcode`, packages it (`.tar.gz`, plus `.zip` on Windows), and
      # uploads it to the GitHub Release for the pushed tag — creating the
      # release if it does not exist yet.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wcode
          target: ${{ matrix.target }}
          archive: wcode-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
