name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  # taiki-e/upload-rust-binary-action only *uploads* to an existing release; it
  # does not create one. Create it here, idempotently (a prior failed run may
  # have left a draft), then gate the uploads on this job.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `gh release create --generate-notes` needs the git repo (and tags).
          fetch-depth: 0
      - name: create or reuse the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          esc() { printf '%s' "${1//$'\n'/'%0A'}"; }
          if gh release view "$tag" >/dev/null 2>&1; then
            out=$(gh release edit "$tag" --draft=false 2>&1) || {
              echo "::error title=release-edit::$(esc "$out")"; exit 1; }
            echo "release $tag already existed; ensured published"
          else
            out=$(gh release create "$tag" --title "$tag" --generate-notes --verify-tag 2>&1) || {
              echo "::error title=release-create::$(esc "$out")"; exit 1; }
            echo "created release $tag"
          fi

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the target toolchain and, for cross targets, the `cross`
      # runner. A no-op for native targets.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Builds `wcode`, packages it (`.tar.gz`), and uploads it with a sha256
      # to the release created above.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wcode
          target: ${{ matrix.target }}
          archive: wcode-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}


  homebrew:
    name: homebrew formula
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GOTCHA: `secrets` is NOT in the context list for a step-level `if:`,
      # so it must be funnelled through a job-level env flag (same trick the
      # publish workflow uses for HAS_TOKEN).
      HAS_TAP: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate the formula for this tag
        run: |
          set -euo pipefail
          scripts/gen-homebrew-formula.sh "${GITHUB_REF_NAME}" Formula/wcode.rb

      - name: Commit the formula to main (idempotent)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git diff` reports nothing for an untracked file, so stage first and
          # test the index — otherwise a first run (no Formula/ yet) silently skips.
          git add Formula/wcode.rb
          if git diff --cached --quiet -- Formula/wcode.rb; then
            echo "formula unchanged for ${GITHUB_REF_NAME}; nothing to commit"
          else
            git commit -m "chore(homebrew): wcode ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Mirror to WeiNyn/homebrew-tap (opt-in)
        if: env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tap="WeiNyn/homebrew-tap"
          rm -rf tap
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${tap}.git" tap
          mkdir -p tap/Formula
          cp Formula/wcode.rb tap/Formula/wcode.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wcode.rb
          if git diff --cached --quiet -- Formula/wcode.rb; then
            echo "tap formula unchanged"
          else
            git commit -m "wcode ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi
