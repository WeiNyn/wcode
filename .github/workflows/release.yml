name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  # taiki-e/upload-rust-binary-action only *uploads* to an existing release; it
  # does not create one. Create it here, idempotently (a prior failed run may
  # have left a draft), then gate the uploads on this job.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create or reuse the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          esc() { printf '%s' "${1//$'\n'/'%0A'}"; }
          if gh release view "$tag" >/dev/null 2>&1; then
            out=$(gh release edit "$tag" --draft=false 2>&1) || {
              echo "::error title=release-edit::$(esc "$out")"; exit 1; }
            echo "release $tag already existed; ensured published"
          else
            out=$(gh release create "$tag" --title "$tag" --generate-notes --verify-tag 2>&1) || {
              echo "::error title=release-create::$(esc "$out")"; exit 1; }
            echo "created release $tag"
          fi

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the target toolchain and, for cross targets, the `cross`
      # runner. A no-op for native targets.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Builds `wcode`, packages it (`.tar.gz`), and uploads it with a sha256
      # to the release created above.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wcode
          target: ${{ matrix.target }}
          archive: wcode-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
