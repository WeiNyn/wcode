name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  # taiki-e/upload-rust-binary-action only *uploads* to an existing release; it
  # does not create one. So create the release from the tag first.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # No CHANGELOG.md yet — create the release from the tag regardless.
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the target toolchain and, for cross targets, the `cross`
      # runner. A no-op for native targets.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Builds `wcode`, packages it (`.tar.gz`), and uploads it with a sha256
      # to the release created above.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: wcode
          target: ${{ matrix.target }}
          archive: wcode-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
