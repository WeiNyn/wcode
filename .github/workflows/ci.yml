name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The repo convention: clippy must be clean.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: |
          set -o pipefail
          if cargo test --workspace --no-fail-fast 2>&1 | tee test.log; then
            exit 0
          fi
          # Surface the failures as check annotations so they are visible in the
          # API/UI without downloading logs.
          grep -E '^---- |panicked at|assertion|left:|right:|^test result: FAILED' test.log \
            | head -12 | while IFS= read -r line; do
              line="${line//$'\r'/}"
              line="${line//'%'/'%25'}"
              echo "::error title=cargo-test::${line}"
            done
          exit 1
