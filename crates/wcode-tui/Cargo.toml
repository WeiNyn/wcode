[package]
name = "wcode-tui"
description = "Full-screen TUI for wcode — a client of the wcode-protocol Backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["wcode", "tui", "terminal", "ratatui", "agent"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
wcode-harness = { workspace = true }
wcode-protocol = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
ratatui = "0.30"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
crossterm = { version = "0.29", features = ["event-stream"] }

pulldown-cmark = { version = "0.13", default-features = false }
[dev-dependencies]
# Only the `demo` example defines a scripted tool, which needs the async-trait
# macro; the library itself stays free of it.
async-trait = { workspace = true }
