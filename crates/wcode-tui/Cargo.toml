[package]
name = "wcode-tui"
description = "Full-screen TUI for wcode — a client of the wcode-protocol Backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wcode-harness = { path = "../wcode-harness" }
wcode-protocol = { path = "../wcode-protocol" }
tokio = { workspace = true }
futures = { workspace = true }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
# Only the `demo` example defines a scripted tool, which needs the async-trait
# macro; the library itself stays free of it.
async-trait = { workspace = true }
