# .wcode/workflow.toml — wcode's feature pipeline (a [workflow] plan template).
# Self-contained (in this repo the project overlays auto-fold ahead of it): use
# it as the explicit --config overlay, driving it with a task:
#
#   wcode --agents --config .wcode/workflow.toml --task "add dark mode"
#   WCODE_CONFIG=.wcode/workflow.toml wcode --agents --task "add dark mode"
#
# This file's node titles carry {{task}}, so it is only useful WITH one. Without
# --task it is inert (see D001 below) — it does not block the boot. For the
# INTERACTIVE dev loop (no injected task; watch the team work in the TUI) use
# .wcode/team.toml instead.
#
# D001 — a [workflow] instantiates ONLY when --task/WCODE_TASK is present. Loaded
# without a task it is INERT: wcode prints "workflow: present but inert (no
# --task)" and boots normally. There is no non-inert case.
#
# The run is HEADLESS: the root is seeded with the task, the scheduler drives the
# DAG, and wcode exits 0 once every node is Done (a node that reaches Failed, a
# --timeout, or a root-turn error exits 1).
#
# OPERATOR TOOLS (W028). You do not have to watch it blind:
#
#   wcode --status latest          the plan, read-only, no model needed
#   wcode --status <groupdir>      one specific run
#   ... --quiet                    with --task: the final summary only (the live
#                                  log on stderr is on by default)
#
# A run that fails, times out, or is Ctrl-C'd prints a copy-pasteable line:
# `resume: wcode --agents --config … --timeout N --resume <groupdir> --task '…'`.
# Its launch record lives at `<groupdir>/run.json`. A resume reloads the plan
# (Doing → Todo), rebuilds the team from the group, and does NOT re-seed.
#
#
# The graph turns a feature request into a PR whose pipeline (CI) passes:
#
#   explore → sketch → review-sketch → implement → verify → publish
#      └──────────────────┘                       └─ implement → ci ← publish
#
# `explore → review-sketch` is not redundancy: R′ below requires every Session
# work node to be consumed by a gate, and `review-sketch` is the first gate that
# can consume `explore`. Without that edge `task complete explore` is REFUSED
# and the pipeline deadlocks at node #1.
#
# The graph is nodes + `[[workflow.edge]]` edges. An edge may carry an optional
# condition (`condition = { script = "…" }` — a shell test, exit 0 = taken — or
# `condition = { judge = "judger", criterion = "…" }` — a no-tool LLM verdict).
# A false/SKIP condition makes the target `Skipped`: it never runs, but its own
# dependents still become ready (a skip prunes a step, it does not stall the DAG).
#
# The brainstorm/brief step is deliberately NOT a node here (D001): it needs a
# human's sign-off, and a headless run has none. It lives in the prompt layer —
# see [orchestrator] guidelines in .wcode/team.toml and the `brainstorm-brief`
# skill.
#
# The members are NOT declared here: each role is a markdown agent definition
# under .wcode/agents/*.md, auto-discovered and folded in. A `[[team]]` entry of
# the same name would win wholesale and silently drop the role.
#
# Overlays fold over the global config — auto-discovered ./.wcode/config.toml,
# then ./.wcode/team.toml, then the explicit --config/WCODE_CONFIG on top — so
# this file needs only what it adds: the [workflow] graph and the [tools] the
# explorer needs. {{task}} is substituted into node titles only (scripts are
# never templated), so the request reaches each member as part of its dispatched
# node.
#
# The three review nodes are `gate = true`. A reject re-opens the node(s) the gate
# depends on AND their entire downstream cone, and the scheduler re-dispatches
# them with the reason — up to `max_attempts`, then the node fails and the
# scheduler escalates. `ci` depends on both `implement` and `publish`, so a red
# pipeline re-opens `implement` (fix) and `publish` (re-push) and the cone re-runs.
#
# R′ — VERIFY GATE AS STRUCTURE (`crates/wcode-cli/src/verify_gate.rs`). Every
# `gate = false` Session node must have a gate node with a DIRECT dependency on
# it, or `task complete <id>` is refused with "a work node with no gate depending
# on it". That is a boot-time guarantee you must respect when editing this file:
# a bare work node (like `explore` was) is a deadlock, not a soft warning. Check
# a change with `wcode --status <groupdir>` after one refused-port boot:
# the journal's `create` lines show each node's `deps` and `gate`.
#
# TIMEOUTS (W028). Each node carries `timeout_secs` — a wall-clock BACKSTOP, not
# a schedule. A node past its limit is `fail`ed with "node timeout: exceeded Ns",
# its dependents stay blocked, and the scheduler escalates to the root (a
# `task reset <id>` retries). The built-in default is 300 s, which is far too
# short for a real build; the values below are sized to the work. `0` disables a
# node's bound. A `script` EDGE carries its own `condition.timeout_secs`
# (default 30 s); a `sleep`-leading script cannot be used as an edge or node at
# all — `SleepRefusalHooks` refuses it before it runs.
#
# `[workflow] timeout_secs` (the TOTAL-run cap) is deliberately UNSET here. A
# feature pipeline legitimately takes hours, and a total cap that fires mid-flight
# throws away resumable work; pass `--timeout <secs>` when you want one.
#
# D002 — a gate is SHAPE, not verification: it proves the step ran, not that the
# work is correct. A Session gate's verdict is the root model's, and a node
# completes when the root says so. Judgment belongs to the reviewer's role.
#
# The publish/ci legs need an authenticated `gh` on PATH and a git remote to push
# to; without them the pipeline stalls at `publish` (or `ci`).

[orchestrator]
guidelines = """
You orchestrate wcode's development team for the feature request in the task. The
[workflow] below seeds the plan at boot as a DAG; a scheduler dispatches each
ready node to its member and hydrates it with its dependencies' artifacts. You do
NOT spawn workers or wake them by hand — you drive the plan:

- NEVER sleep or poll to wait for a node. The scheduler dispatches on its own;
  when a node is running, your job is to END YOUR TURN. A worker's report
  arrives as a `Wake` that starts your NEXT turn — so `bash { command: "sleep …" }`
  or any polling loop BLOCKS the very message you are waiting for. Do not wait;
  the report wakes you.
- A node completes when its worker reports. Call `task complete <id>` — pass the
  worker's report as `artifact` so it hydrates the dependents.
- The three review nodes are `gate = true` (review-sketch, verify, ci). Relay a
  verdict: `task complete <id>` to approve, or `task reject <id> "<reason>"` to
  send the work back. A rejection re-opens the node(s) the gate depends on — and
  their whole downstream cone — and the scheduler re-dispatches with the reason
  injected. At the rework cap the node fails and the scheduler escalates to you;
  `task reset <id>` retries it.
- `ci` is the pipeline gate. When its report says the PR checks PASS, `task
  complete ci`; when they FAIL, `task reject ci "<the failing check(s)>"` so the
  implementation cone is re-opened and the loop runs again.
- `task list` shows the plan: `#id [state] title (owner) ← #deps ×attempts`.
- You may add nodes (`task create`/`depends`) for a task the seeded graph does
  not cover — e.g. skip the sketch/review-first-layer steps for a tiny change.

A gate is SHAPE, not verification: it proves the step ran, never that the work is
correct. The reviewer's role is where judgment lives — read the diff, run
`cargo test --workspace` and `cargo clippy --workspace --all-targets`, and reject
with `file:anchor` evidence rather than approving on the gate's existence.

Each member keeps its role (see .wcode/agents/*.md). Keep the kernel
(crates/wcode-harness) free of presentation concerns; the CLI stays thin. One
logical change per commit (imperative, area-prefixed: harness:/cli:/tui:/docs:);
every change must keep `cargo test --workspace` and
`cargo clippy --workspace --all-targets` clean; prefer a live end-to-end check
over unit tests alone; track multi-step work in docs/next-steps.md; a task is not
done until the second-layer review approves.
"""

# The feature pipeline, as a DAG. `{{task}}` is the request, substituted into each
# member title. The three review nodes are gates that send work back; `ci`
# re-opens the whole implementation cone when the PR pipeline is red.
[workflow]
max_attempts = 3

[[workflow.node]]
id = "explore"                      # map the ground truth for the request
timeout_secs = 900                  # recon over a large tree; a backstop only
member = "explorer"
title = "Explore the repo for the feature request: {{task}}"

[[workflow.node]]
id = "sketch"                       # sketch the interface before coding
timeout_secs = 900
member = "sketcher"
title = "Sketch the interface for: {{task}}"

[[workflow.node]]
id = "review-sketch"                # first-layer gate: approve the sketch, or
member = "reviewer"                 # reject it and re-open `sketch`
gate = true
timeout_secs = 1200                 # a reading review, not a build
title = "First-layer review of the sketch"

[[workflow.node]]
id = "implement"                    # the developer fills the approved sketch on
member = "developer"                # a feature branch it creates or reuses
timeout_secs = 3600                 # a cold build + edits; the longest work node
title = "Create/reuse a feature branch, then implement the feature: {{task}}"

[[workflow.node]]
id = "verify"                       # second-layer gate: approve the diff (after
member = "reviewer"                 # running cargo test/clippy), or re-open it
gate = true
timeout_secs = 3600                 # it RUNS the suite: give it implement's budget
title = "Second-layer review: read the diff, run cargo test --workspace and cargo clippy --workspace --all-targets, then approve or reject"

[[workflow.node]]
id = "publish"                      # commit + push the branch + open/update the PR
member = "developer"
timeout_secs = 1800
title = "Commit all changes, push the branch, and open or update the PR (gh pr create --fill, or gh pr view when it already exists)"

[[workflow.node]]
id = "ci"                           # the pipeline gate: wait for the PR checks
member = "developer"                # (gh pr checks --watch) and report the result
gate = true
# Two different bounds, both real: the node deadline caps the WHOLE node (the
# worker may poll/wait), while the `timeout_secs` in the title is the `bash`
# tool's own cap on a single `gh pr checks --watch` call. Keep node > bash.
timeout_secs = 7200
title = "Wait for the PR checks to finish (gh pr checks --watch, run via bash with a long timeout_secs such as 900), then report PASS or FAIL"

# The DAG as explicit edges (a `depends_on` on a node is gone). One edge per
# `(from, to)` pair; `topo_order` walks these. Unconditional here — a condition
# is opt-in per edge (`condition = { script = "…" }` / `{ judge = … }`).
[[workflow.edge]]
from = "explore"
to = "sketch"
[[workflow.edge]]
from = "sketch"
to = "review-sketch"
[[workflow.edge]]
from = "review-sketch"
to = "implement"
[[workflow.edge]]
from = "implement"
to = "verify"
# R′ consumption: `explore` needs a gate with a DIRECT dep on it, or its
# `task complete` is refused. `review-sketch` is that gate (it already ran after
# `explore` transitively, so this adds no waiting — it only makes the dependency
# explicit to the verify-gate policy).
[[workflow.edge]]
from = "explore"
to = "review-sketch"
[[workflow.edge]]
from = "verify"
to = "publish"
[[workflow.edge]]
from = "implement"
to = "ci"
[[workflow.edge]]
from = "publish"
to = "ci"

# grep/find are off by default; the explorer's allow-list names them.
[tools]
grep = true
find = true
