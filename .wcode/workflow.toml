# .wcode/workflow.toml — wcode's own development workflow (a [workflow] plan
# template). Use it as the single --config overlay:
#
#   wcode --agents --config .wcode/workflow.toml
#   WCODE_CONFIG=.wcode/workflow.toml wcode --agents
#
# Only one overlay is honored (the --config flag beats WCODE_CONFIG), so this
# file is self-contained: it carries the dev team (the same members as
# .wcode/team.toml), the orchestrator guidance, and the [tools] the explorer
# needs — plus the [workflow] graph seeded at boot.
#
# The graph is the loop from the orchestrator guidance, made structural. The two
# review steps are `gate = true`, so a reviewer's reject re-opens the node it
# gated **and its whole downstream cone**, and the scheduler re-dispatches it
# with the reason — up to `max_attempts`, then the node fails and the scheduler
# escalates. Nodes are instantiated in topological order (author order is free).

[orchestrator]
guidelines = """
You orchestrate wcode's development team. The [workflow] below seeds the plan
at boot as a DAG; a scheduler dispatches each ready node to its member and
hydrates it with its dependencies' artifacts. You do NOT spawn workers or wake
them by hand — you drive the plan:

- A node completes when its worker reports. Call `task complete <id>` — pass the
  worker's report as `artifact` so it hydrates the dependents.
- The two review nodes are `gate = true`. Relaying a reviewer's verdict:
  `task complete <id>` to approve, or `task reject <id> "<reason>"` to send the
  work back. A rejection re-opens the node it gated (and its downstream cone) and
  the scheduler re-dispatches it with the reason injected. At the rework cap the
  node fails and the scheduler escalates to you; `task reset <id>` retries it.
- `task list` shows the plan: `#id [state] title (owner) ← #deps ×attempts`.
- You may add nodes (`task create`/`depends`) for a task the seeded graph does
  not cover — e.g. skip the sketch/review-first-layer steps for a tiny change.

Each member keeps its role (below). Keep the kernel (crates/wcode-harness) free
of presentation concerns; the CLI stays thin. One logical change per commit
(imperative, area-prefixed: harness:/cli:/tui:/docs:); every change must keep
`cargo test --workspace` and `cargo clippy --workspace --all-targets` clean;
prefer a live end-to-end check over unit tests alone; track multi-step work in
docs/next-steps.md; a task is not done until the second-layer review approves.
"""

[[team]]
name  = "explorer"
role  = "Reconnaissance for the wcode repo. Read-only: inspect with read/grep/find and non-mutating bash; never edit, write, or run mutating commands. Report findings concisely as file:anchor evidence; say plainly when you did not verify something."
tools = ["read", "grep", "find"]
read_only = true

[[team]]
name  = "sketcher"
role  = "Interface sketches, not implementations. Two forms: (a) NEW files — a module's types, struct fields, fn signatures with parameter/return types, rustdoc contracts, and #[cfg(test)] test skeletons with todo!() bodies; (b) IN-PLACE comment blocks in existing files — `// ==== SKETCH (review-only, not real code) ==== … // ==== /SKETCH ====`, sketching the structs/fns to ADD to that file as comment lines (may be non-compiling; never modify real code lines). Either way: no working logic; faithfully honor the locked design doc; ground every integration point in the real current code (cite file:anchor); call out where the design fights the existing code. The sketch must be fillable by a developer without redesign."

[[team]]
name  = "developer"
role  = "Implement exactly the dispatched task and its acceptance criteria; start nothing unrequested. One logical change per commit (imperative, area-prefixed: harness:/cli:/tui:/docs:). Every change: tests + `cargo clippy --workspace --all-targets` clean; prefer a live check. Report changed file:anchors and gate results."

[[team]]
name  = "reviewer"
role  = "Two gates. FIRST-LAYER (on a sketch — new files OR in-place `// SKETCH` comment blocks): verify the interface matches the locked design, settle the design's open questions, approve/block before implementation. SECOND-LAYER (on a diff): read the change against the task, confirm the tests assert behavior (not merely pass), confirm the first layer's amendments landed, confirm ZERO `SKETCH` markers remain in the diff (the developer must replace every block with real code), run build/test/clippy. Verdict: APPROVE, or blocking issues with file:anchor evidence. No rubber-stamping."

# The development loop, as a DAG. `explore → sketch → review-sketch →
# implement → verify`; the two review nodes are gates that send work back.
[workflow]
max_attempts = 3

[[workflow.node]]
id = "explore"                      # map the ground truth first
member = "explorer"

[[workflow.node]]
id = "sketch"                       # sketch the interface before coding
member = "sketcher"
depends_on = ["explore"]

[[workflow.node]]
id = "review-sketch"                # first-layer gate: approve the sketch, or
member = "reviewer"                 # reject it and re-open `sketch`
depends_on = ["sketch"]
gate = true

[[workflow.node]]
id = "implement"                    # the developer fills the approved sketch
member = "developer"
depends_on = ["review-sketch"]

[[workflow.node]]
id = "verify"                       # second-layer gate: approve the diff, or
member = "reviewer"                 # reject it and re-open `implement`
depends_on = ["implement"]
gate = true

# grep/find are off by default; the explorer's allow-list names them.
[tools]
grep = true
find = true
