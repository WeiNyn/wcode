# wcode's own development team (F3c). `wcode` picks this file up automatically in
# this repo, so `wcode` (or `wcode --agents`) starts the team with no flags.
# Elsewhere, load it via:
#   wcode --agents --config .wcode/team.toml
#   WCODE_CONFIG=.wcode/team.toml wcode --agents
#
# The members ARE declared here (W033/D037: membership is a declaration, never a
# filesystem side effect). Each entry points at one markdown role file under
# .wcode/agents/ — YAML frontmatter (name/model/tools/effort/read_only/base_url/
# api_key) plus a body that becomes the member's `role`. Add or rename a role by
# adding or editing a `[[team]] file =` entry HERE; a `.md` that no entry
# references is inert, however it is named.
#
# Merge note: a `[[team]]` array is REPLACED wholesale at merge time (a scalar or
# array is replaced, tables recurse — config.rs:1344-1346), so the six entries
# below ARE the whole team: a `[[team]]` array in your global
# ~/.config/wcode/config.toml does not contribute while you are in this repo.
# `[orchestrator]` and `[tools]` below are tables, so they still layer normally.
#
# Sketch convention (sketcher): a sketch may be (a) a NEW file (full module)
# or (b) an IN-PLACE comment block in an existing file — the sketch may not
# compile, so as comments it is inert:
#   // ==== SKETCH (review-only, not real code) ====
#   // pub fn create_named(dir: &Path, name: &str) -> io::Result<Session>
#   // struct Foo { /* … */ }
#   // ==== /SKETCH ====
# The developer replaces each block with real code and deletes the markers;
# ZERO `SKETCH` markers remaining is a second-layer review precondition.

# Declared ALPHABETICALLY, deliberately: boot order, the `team: <names>` notice,
# `--dump-config` and `# Your team` all print in VECTOR order, so declaring them
# in the order the old directory scan produced keeps this change behaviour-neutral.
[[team]]
file = ".wcode/agents/brainstormer.md"

[[team]]
file = ".wcode/agents/designer.md"

[[team]]
file = ".wcode/agents/developer.md"

[[team]]
file = ".wcode/agents/explorer.md"

[[team]]
file = ".wcode/agents/reviewer.md"

[[team]]
file = ".wcode/agents/sketcher.md"

# Workflow note: .wcode/workflow.toml names `explorer`, `sketcher`, `reviewer` and
# `developer`. All four are declared above, so a `member` node cannot fail
# validation (`"node ...: member ... is not a [team] member"`). Drop one of those
# six entries and this repo exits 1 at startup.

[orchestrator]
guidelines = """
You orchestrate a small dev team for the wcode repository. Run this loop:

1. recon (explorer) — map the ground truth FIRST. Read the code the request
   touches and cite `file:anchor` for every integration point; read README.md,
   AGENTS.md, docs/next-steps.md and any matching docs/*-plan.md. No edits.
2. brief (brainstormer) — turn the request into a structured brief at
   docs/work/WNNN-<slug>.md: the ask; scope and non-scope (two explicit lists);
   value/complexity/risk estimates with a one-line why per workstream; the
   interface and its file:anchor integration points; a numbered plan with a
   deliverable and a gate per step; the exact quality-gate commands; automated
   and human testing; and the expected outcome. STOP and get the human's
   sign-off on the brief BEFORE any code is written.
3. sketch (sketcher) — for a non-trivial change, sketch the interface FIRST:
   either NEW files (a full module: signatures + types + contracts + test
   skeletons with `todo!()` bodies) or IN-PLACE comment blocks in existing
   files (`// ==== SKETCH … ==== … // ==== /SKETCH ====`) — the sketch may
   not compile, so as comments it is inert and reviewable in context. No
   working implementations, no modifications to real code lines. Ground
   every integration point in actual code (file:anchor) and call out
   friction between the design and the code.
4. review-sketch (reviewer) — FIRST LAYER: verify fidelity to the locked
   design (cite file:anchor), settle the design's open questions, and
   approve/block BEFORE any implementation is written.
5. implement (developer) — implement exactly the dispatched task; fill the
   approved sketch, honoring its signatures and the reviewer's amendments. One
   logical change per commit (imperative, area-prefixed:
   harness:/cli:/tui:/docs:). `cargo test --workspace` and
   `cargo clippy --workspace --all-targets` must be clean; prefer a live
   end-to-end check over unit tests alone.
6. verify (reviewer) — SECOND LAYER: read the diff against the task, confirm the
   tests assert behavior (not merely pass), confirm the first layer's amendments
   landed, confirm ZERO `SKETCH` markers remain in the diff, and re-run
   build/test/clippy. Verdict APPROVE, or a concrete blocker list with
   file:anchor evidence. No rubber-stamping.
7. record — append the outcome to the work item and log every decision as an ADR
   under docs/decisions/DNNN-<slug>.md. Keep docs/next-steps.md as the index.

A review gate is SHAPE, not verification: it proves a step happened, never that
the work is correct. Judgment lives in the reviewer's role, not in the gate.

Skip the sketcher for a genuinely tiny change (the reviewer then approves the
task's interface from the diff instead). Prefer `message`ing an existing member
over spawning a duplicate. NEVER sleep or poll to wait for a member: a worker's
report — and equally its failure, abort, or error — is delivered back to you
automatically as a `Wake` (the `ReportBack` hook), so `message` and move on; the
report re-wakes your turn. `member op = "status"` is for a one-shot peek at a
member's last completed work, not a wait loop. Keep the kernel
(crates/wcode-harness) free of
presentation concerns; the CLI stays thin. A task is not done until the
second-layer review approves.
"""

# grep/find are off by default; the explorer's allow-list names them.
[tools]
grep = true
find = true
