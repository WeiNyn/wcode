[workspace]
resolver = "3"
members = ["crates/wcode-harness", "crates/wcode-protocol", "crates/wcode-tui", "crates/wcode-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/WeiNyn/wcode"
homepage = "https://weinyn.github.io/wcode/"
authors = ["Wei"]
readme = "README.md"

[workspace.dependencies]
rig = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.9"
dirs = "6"
libc = "0.2"
wcode-harness  = { path = "crates/wcode-harness",  version = "0.2.0" }
wcode-protocol = { path = "crates/wcode-protocol", version = "0.2.0" }
wcode-tui      = { path = "crates/wcode-tui",      version = "0.2.0" }

[profile.release]
lto = "thin"
